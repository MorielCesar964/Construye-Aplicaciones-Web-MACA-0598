<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body>
<!--aqui se junta y se manda toda la informacion del usuario-->
<form action="" method="post">
Ingresa tu nombre:
<!--casilla bloqueada que no deja que el usuario escriba nada-->
<input type="text" name="nombre" disabled><br>
Contraseña:
<!--casilla para contraseña que solo te deja escribir maximo 5 letras o numeros-->
<input type="password" name="pass" maxlength="5"><br>
Comentarios:
<!--caja de texto que solo sirve para leer, no se puede cambiar ni borrar el texto-->
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
