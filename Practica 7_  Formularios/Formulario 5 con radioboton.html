<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<!--Casilla que se encarga de recolectar y enviar los datos del usuario-->
<form action="" method="post">
Ingresa tu nombre:
<!--Casilla que se encarga de solicitar y enviar el nombre del usuario-->
<input type="text" name="nombre">
<br>
Selecciona el maximo de estudios que tienes:
<br>
<--Linea de funciones que se encarga de poner un boton circular para que el usuario pueda seleccionar solamente una opcion-->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<!--Casilla que se encarga de enviar la informacion del usuario-->
<input type="submit" value="enviar">
<!--Casilla que se encarga de borrar la informacion del usuario-->
<input type="reset" value="borrar">
</form>
</body>
</html>
