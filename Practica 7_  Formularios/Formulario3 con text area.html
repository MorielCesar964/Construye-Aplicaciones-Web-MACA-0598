<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<!--Funcion principal que se encarga de recolectar y enviar los datos-->
<form action="" method="post">
Ingresa tu nombre:
<!--Casilla que se encaragara de solicitar el nombre al usuario-->
<input type="text" name="nombre">
<br>
Ingresa tu correo:
<!--campo que sirve para poder validar un correo electronico-->
<input type="email" name="correo">
<br>
Ingresa tus comentarios:
<!--area de texto que funciona para agregar comentarios-->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<!--boton para enviar los datos recolectados-->
<input type="submit" value="enviar">
<!--boton para borrar los datos-->
<input type="reset" value="borrar">
</form>
</body>
</html>
