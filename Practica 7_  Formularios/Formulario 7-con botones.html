<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body>
<!--funcion principal que junta y manda los datos del usuario-->
<form action="" method="post">
Ingresa tu nombre:
<!--casilla de texto para pedir el nombre del usuario-->
<input type="text" name="nombre">
<br>
<!--boton de enviar que incluye un icono de avion de papel-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!--boton para borrar todo que incluye un icono de bote de basura-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
</body>
</html>
