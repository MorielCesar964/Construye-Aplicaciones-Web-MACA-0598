<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<!--Casilla que se encarga de recolectar y enviar los datos del usuario-->
<form action="" method="post">
Ingresa tu nombre:
<!--Casilla que se encarga de solicitar el nombre del usuario-->
<input type="text" name="nombre">
<br>
Selecciona los lenguajes que conozcas:
<br>
<!--Funcion: checkbox, se encarga de permitir que el usuario seleccione una o varias opciones, asi como llenar casillas, en este caso para seleccionar lenguajes de programacion que conozcas--> 
<input type="checkbox" name="Java">Java <br>
<input type="checkbox" name="Python"> Python <br>
<input type="checkbox" name="C#">C# <br>
<input type="checkbox" name="Flutter"> Flutter <br>
</form>
</body>
</html>
