<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Perfumeria Scent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #FAF9F6;
            color: #222222;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        header {
            background-color: #1A1A1A;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #D4AF37;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-regresar {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #D4AF37;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-regresar:hover {
            background-color: #D4AF37;
            color: #1A1A1A;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .login-card h2 {
            font-size: 20px;
            color: #1A1A1A;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #E0E0E0;
            padding-bottom: 10px;
        }

        .campo {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333333;
        }

        .campo input {
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #FAF9F6;
        }

        .campo input:focus {
            outline: none;
            border-color: #D4AF37;
        }

        .btn-login {
            background-color: #1A1A1A;
            color: #ffffff;
            border: 1px solid #D4AF37;
            padding: 12px;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #D4AF37;
            color: #1A1A1A;
        }

        footer {
            background-color: #1A1A1A;
            color: #cccccc;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-top: 1px solid #333333;
        }

        footer strong {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Perfumeria Scent</h1>
        <a href="index.html" class="btn-regresar">← Regresar al Inicio</a>
    </header>

    <main>
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            
            <form action="login_procesar.php" method="POST">
                
                <div class="campo">
                    <label for="gmail">Correo Gmail:</label>
                    <input type="email" id="gmail" name="gmail" pattern=".+@gmail\.com" required placeholder="ejemplo@gmail.com">
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-login">Ingresar</button>

            </form>
        </div>
    </main>

    <footer>
        <p><strong>Nombre:</strong> Moriel Arvilla Cesar</p>
        <p><strong>No. Control:</strong> 0598</p>
        <p><strong>Grado y Grupo:</strong> 5I</p>
    </footer>

</body>
</html>
