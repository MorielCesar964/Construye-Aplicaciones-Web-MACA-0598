<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinépolis - Club Cinépolis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0B1D3A;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 1px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        nav a.active {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 4px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
            width: 100%;
        }

        main h2 {
            font-size: 22px;
            color: #0B1D3A;
            margin-bottom: 20px;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 10px;
            text-align: center;
        }

        .formulario-club {
            border: 1px solid #dddddd;
            border-radius: 6px;
            padding: 25px;
            background-color: #ffffff;
        }

        .campo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 14px;
            color: #0B1D3A;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .campo input {
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .boton-enviar {
            background-color: #0B1D3A;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .boton-enviar:hover {
            background-color: #003366;
        }

        footer {
            background-color: #0B1D3A;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>CINÉPOLIS</h1>
        <nav>
            <a href="index.html">Cartelera</a>
            <a href="estrenos.html">Próximos Estrenos</a>
            <a href="club.html" class="active">Club Cinépolis</a>
            <a href="login.html">Iniciar Sesión / Registro</a>
        </nav>
    </header>

    <main>
        <h2>Club Cinépolis</h2>

        <form class="formulario-club">
            <div class="campo">
                <label for="tarjeta">Número de Tarjeta Club Cinépolis:</label>
                <input type="text" id="tarjeta" name="tarjeta" placeholder="Ingresa tu número de tarjeta">
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            </div>

            <button type="submit" class="boton-enviar">Consultar Puntos</button>
        </form>
    </main>

    <footer>
        <p><strong>Nombre:</strong> Moriel Arvilla Cesar</p>
        <p><strong>No. Control:</strong> 0598</p>
        <p><strong>Grado y Grupo:</strong> 5I</p>
    </footer>

</body>
</html>
